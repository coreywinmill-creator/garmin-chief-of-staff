name: Garmin Chief of Staff cloud v2 test
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
permissions:
  contents: read
concurrency:
  group: garmin-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GARMIN_DRIVE_FILE_ID: ${{ secrets.GARMIN_DRIVE_FILE_ID }}
      GARMIN_COS_HOME: ${{ runner.temp }}/garmin-cos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Collect Garmin data
        run: python collector.py
      - name: Build privacy-filtered report
        run: python build_summary.py "$GARMIN_COS_HOME/reports/latest.json" "$RUNNER_TEMP/garmin-summary.json"
      - name: Upload test report to Google Drive
        run: python upload_drive.py "$RUNNER_TEMP/garmin-summary.json"
